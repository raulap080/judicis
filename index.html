<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registre de judicis</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--tx:#1b2430;--mu:#677284;--bd:#d9dee6;--ac:#1f4e9c;--ok:#1b7a43;--wa:#b26a00;--er:#b3261e}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141a;--card:#1a2029;--tx:#e6eaf0;--mu:#93a0b3;--bd:#2c3644;--ac:#7aa7ec;--ok:#58c58a;--wa:#e5a64a;--er:#f2877f}}
:root[data-theme="dark"]{--bg:#10141a;--card:#1a2029;--tx:#e6eaf0;--mu:#93a0b3;--bd:#2c3644;--ac:#7aa7ec;--ok:#58c58a;--wa:#e5a64a;--er:#f2877f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 13px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-block}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.dan{color:var(--er)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.item{cursor:pointer}.item b{display:block}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.ok{color:var(--ok);border-color:var(--ok)}.wa{color:var(--wa);border-color:var(--wa)}.er{color:var(--er);border-color:var(--er)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
textarea{min-height:80px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;margin:10px 0 0;color:var(--tx);font-size:15px}
.chk input{width:auto}
h2{font-size:15px;margin:18px 0 0;padding-top:12px;border-top:1px solid var(--bd)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.mu{color:var(--mu);font-size:13px}
</style></head><body><main id="app"></main>
<script>
let items=[],view='list',cur=null,filter='todos';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d?new Date(d+'T00:00').toLocaleDateString('ca-ES',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'';

function lsRead(){try{return JSON.parse(localStorage.getItem('juicios')||'[]')}catch(e){return[]}}
function lsWrite(){try{localStorage.setItem('juicios',JSON.stringify(items))}catch(e){}}

function init(){
  items=lsRead();
  render();
}

function save(j){
  const i=items.findIndex(x=>x.id===j.id);
  if(i<0)items.push({...j});else items[i]={...j};
  lsWrite();
}

function remove(id){
  items=items.filter(x=>x.id!==id);
  lsWrite();
}

function status(j){
  if(j.celebrado==='no'||j.celebrado==='suspendido')return['Suspès','er'];
  if(j.celebrado!=='si')return['Pendent','wa'];
  if(j.cobrado)return['Cobrat','ok'];
  if(j.dad67)return['DAD 67 presentada','wa'];
  return['Celebrat · falta DAD 67','wa'];
}

function calUrl(j){
  if(!j.fecha)return'#';
  const d=j.fecha.replace(/-/g,''),h=(j.hora||'09:00').split(':'),s=h[0]+h[1]+'00';
  const e=String(Math.min(23,+h[0]+2)).padStart(2,'0')+h[1]+'00';
  const det=['Expedient: '+(j.expedient||''),'Procediment: '+(j.proc||''),'Òrgan: '+(j.juzgado||''),'Sala: '+(j.sala||''),'Atestat: '+(j.atestado||''),'Qualitat: '+(j.qualitat||''),'Modalitat: '+(j.modalidadPrev||''),j.notas||''].join('\n');
  return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent((j.objecte||'Judici')+' '+(j.proc||j.expedient||''))+'&dates='+d+'T'+s+'/'+d+'T'+e+'&ctz=Europe/Madrid&location='+encodeURIComponent([j.juzgado,j.adreca,j.sala].filter(Boolean).join(', '))+'&details='+encodeURIComponent(det);
}

function render(){
  if(view==='list'){
    const list=items.filter(j=>filter==='todos'||(filter==='pend'&&j.celebrado!=='si'&&j.celebrado!=='no'&&j.celebrado!=='suspendido')||(filter==='dad'&&j.celebrado==='si'&&!j.dad67)||(filter==='cobro'&&j.celebrado==='si'&&!j.cobrado)).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
    app.innerHTML=`<h1>Registre de judicis <button class="pri" onclick="edit()">+ Nou</button></h1>
    <select onchange="filter=this.value;render()" style="margin-bottom:12px">
      ${[['todos','Tots'],['pend','Pendents de celebrar'],['dad','Celebrats sense DAD 67'],['cobro','Pendents de cobrament']].map(o=>`<option value="${o[0]}" ${filter===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
    ${list.length?list.map(j=>{const[t,c]=status(j);return`<div class="card item" onclick="edit('${j.id}')"><b>${esc(j.proc\vert{}\vert{}j.expedient\vert{}\vert{}'Sense núm. de procediment')} — ${esc(j.objecte||'')}</b>
      <span class="mu">${fmt(j.fecha)}${esc(j.hora)} ${esc(j.sala)}<br>${esc(j.juzgado)}</span>
      <div class="row"><span class="tag ${c}">${t}</span>${j.qualitat?`<span class="tag">${esc(j.qualitat)}</span>`:''}${j.justificante?'<span class="tag ok">Justificant</span>':''}${(j.files||[]).length?`<span class="tag">📎 ${j.files.length}</span>`:''}${j.celebrado==='si'?`<span class="tag">${j.modalidad==='video'?'Videoconferència':'Presencial'}</span>`:''}</div></div>`}).join(''):'<p class="mu">Encara no hi ha judicis. Prem «+ Nou».</p>'}
    <p class="mu">Les dades es desen automàticament en aquest navegador.</p>`;
    return;
  }
  const j=cur,v=(k)=>esc(j[k]||''),ck=k=>j[k]?'checked':'';
  app.innerHTML=`<h1>${items.some(x=>x.id===j.id)?'Judici':'Nou judici'} <button onclick="back()">Tancar</button></h1>
  <div class="card"><h2 style="border:0;margin:0;padding:0">Dades del judici</h2>
  ${items.some(x=>x.id===j.id)?'':`<label>Enganxar la citació (omple els camps automàticament)</label><textarea id="paste" placeholder="Enganxa aquí el text de la citació…"></textarea><div class="bar" style="margin-top:6px"><button onclick="parsePaste()">Omplir des del text</button></div>`}
  <label>Expedient</label><input id="expedient" value="${v('expedient')}">
  <div class="g2"><div><label>Procediment</label><input id="proc" value="${v('proc')}"></div><div><label>Atestat</label><input id="atestado" value="${v('atestado')}"></div></div>
  <label>Òrgan jurisdiccional</label><input id="juzgado" value="${v('juzgado')}">
  <label>Adreça</label><input id="adreca" value="${v('adreca')}">
  <div class="g2"><div><label>Telèfon</label><input id="telefon" type="tel" value="${v('telefon')}"></div><div><label>Fax</label><input id="fax" type="tel" value="${v('fax')}"></div></div>
  <div class="g2"><div><label>Qualitat de la compareixença</label><input id="qualitat" value="${v('qualitat')}"></div><div><label>Sala</label><input id="sala" value="${v('sala')}"></div></div>
  <label>Objecte de la compareixença</label><input id="objecte" value="${v('objecte')}">
  <div class="g2"><div><label>Data</label><input type="date" id="fecha" value="${v('fecha')}"></div><div><label>Hora</label><input type="time" id="hora" value="${v('hora')}"></div></div>
  <label>Modalitat prevista</label><select id="modalidadPrev"><option value="presencial" ${j.modalidadPrev!=='video'?'selected':''}>Presencial</option><option value="video" ${j.modalidadPrev==='video'?'selected':''}>Videoconferència</option></select>
  <label>Notes</label><textarea id="notas">${v('notas')}</textarea>
  <div class="bar"><a class="btn pri" id="cal" target="_blank" rel="noopener" onclick="sync()" href="${calUrl(j)}">📅 Afegir a Google Calendar</a></div>
  <p class="mu">S'obre Google Calendar amb l'esdeveniment a punt per confirmar (2 h de durada per defecte).</p></div>
  <div class="card"><h2 style="border:0;margin:0;padding:0">Seguiment</h2>
  <label>S'ha celebrat?</label><select id="celebrado">${[['','Pendent'],['si','Sí'],['no','No'],['suspendido','Suspès']].map(o=>`<option value="${o[0]}" ${(j.celebrado\vert{}\vert{}'')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
  <label>Modalitat real</label><select id="modalidad"><option value="presencial" ${j.modalidad!=='video'?'selected':''}>Presencial</option><option value="video" ${j.modalidad==='video'?'selected':''}>Videoconferència</option></select>
  <div class="g2"><div><label>Hora d'arribada</label><input type="time" id="llegada" value="${v('llegada')}"></div><div><label>Hora de sortida</label><input type="time" id="salida" value="${v('salida')}"></div></div>
  <label>Minuta policial</label><textarea id="minuta">${v('minuta')}</textarea>
  <label>Persones denunciades</label><textarea id="denunciados">${v('denunciados')}</textarea>
  <label>Testimonis / agents compareixents</label><textarea id="testigos">${v('testigos')}</textarea>
  <h2>Cobrament</h2>
  <label class="chk"><input type="checkbox" id="justificante" ${ck('justificante')}> Tinc el justificant</label>
  <label class="chk"><input type="checkbox" id="dad67" ${ck('dad67')}> Sol·licitud DAD 67 presentada</label>
  <div id="d1"><label>Data de presentació</label><input type="date" id="dad67Fecha" value="${v('dad67Fecha')}"></div>
  <label class="chk"><input type="checkbox" id="cobrado" ${ck('cobrado')}> Cobrat</label>
  <div><label>Data de cobrament</label><input type="date" id="cobradoFecha" value="${v('cobradoFecha')}"></div></div>
  <div class="card"><h2 style="border:0;margin:0;padding:0">Fitxers i enllaços de l'expedient</h2>${(j.files||[]).map((f,i)=>`<div class="row" style="align-items:center;justify-content:space-between"><a href="${esc(f.url)}" target="_blank" rel="noopener">🔗 ${esc(f.name)}</a><button class="dan" onclick="rmFile(${i})">Treure</button></div>`).join('')||'<p class="mu">Sense enllaços afegits.</p>'}<label style="margin-top:10px">Afegir un enllaç (Google Drive, Dropbox, OneDrive…)</label><input id="lname" placeholder="Nom de l'arxiu o document (opcional)"><input id="lurl" type="url" placeholder="https://…" style="margin-top:6px"><div class="bar" style="margin-top:6px"><button type="button" onclick="addLink()">Afegir enllaç</button></div></div>
  <div class="bar"><button class="pri" onclick="sv()">Desar</button>${items.some(x=>x.id===j.id)?'<button class="dan" onclick="del()">Eliminar</button>':''}</div>`;
}

const F=['expedient','proc','atestado','juzgado','adreca','fax','telefon','sala','qualitat','objecte','fecha','hora','modalidadPrev','notas','celebrado','modalidad','llegada','salida','minuta','denunciados','testigos','dad67Fecha','cobradoFecha'],C=['justificante','dad67','cobrado'];

function collect(){F.forEach(k=>cur[k]=$('#'+k).value);C.forEach(k=>cur[k]=$('#'+k).checked)}
function sync(){collect();$('#cal').href=calUrl(cur)}
function sv(){collect();save(cur);back()}
function del(){if(confirm('Vols eliminar aquest judici?')){remove(cur.id);back()}}

function addLink(){
  collect();
  const u=$('#lurl').value.trim();
  if(!/^https?:\/\//i.test(u)){alert('Escriu un enllaç que comenci per https://');return}
  cur.files=cur.files||[];
  cur.files.push({name:$('#lname').value.trim()||u,url:u,link:true});
  save(cur);
  render();
}

function rmFile(i){collect();cur.files.splice(i,1);save(cur);render()}

function parsePaste(){
  collect();
  const t=$('#paste').value,g=r=>{const m=t.match(r);return m?m[1].trim():''},st=(k,v)=>{if(v)cur[k]=v};
  st('expedient',g(/Expedient:?\s*([^\n]+)/i));
  st('juzgado',g(/[ÒO]rgan jurisdiccional:?\s*([^\n]+)/i));
  st('adreca',g(/Adre[çc]a:?\s*([^\n]+)/i));
  st('fax',g(/Fax:?\s*([^\n]+)/i));
  st('telefon',g(/Tel[èe]fon:?\s*([^\n]+)/i));
  
  const d=t.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})[ \t]*([^\n]*)/);
  if(d){cur.fecha=d[3]+'-'+d[2].padStart(2,'0')+'-'+d[1].padStart(2,'0');cur.hora=d[4].padStart(2,'0')+':'+d[5];cur.sala=d[6].trim()}
  
  st('atestado',g(/Atestat:?\s*([^\n]+)/i));
  st('proc',g(/Procediment:?\s*([^\n]+)/i));
  st('qualitat',g(/Qualitat de la Compareixen[çc]a:?\s*([^\n]+)/i));
  st('objecte',g(/Objecte de la compareixen[çc]a:?\s*([^\n]+)/i));
  render();
}

function edit(id){cur=id?{...items.find(x=>x.id===id)}:{id:'j'+Date.now().toString(36)};view='form';render();scrollTo(0,0)}
function back(){view='list';cur=null;render()}

init();
</script></body></html>
